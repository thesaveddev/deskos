services:
  - type: web
    name: reydesk-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deskos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reydesk-redis
          type: redis
          property: connectionString
      - key: REYDESK_JWT_SECRET
        generateValue: true
      - key: REYDESK_EMAIL_KEY
        generateValue: true
      - key: REYDESK_RELAY_SECRET
        generateValue: true
      - key: REYDESK_AUTO_MIGRATE
        value: "1"
      - key: REYDESK_PUBLIC_URL
        value: ""  # Set to the ReyDesk API URL after first deploy, e.g. https://reydesk-api.onrender.com
      - key: REYDESK_RELAY_URL
        value: ""  # Set to the ReyDesk relay WebSocket URL
      - key: PORT
        value: "4000"
    healthCheckPath: /healthz
    autoDeploy: true

  - type: redis
    name: reydesk-redis
    ipAllowList: []  # Only accessible from other Render services

databases:
  - name: deskos-db
    plan: free
    databaseName: deskos
    user: deskos
