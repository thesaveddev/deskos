name: Deploy to Production

on:
  # Deploy after the E2E suite passes on master. The deploy job then waits for
  # Optional Android builds must not block the tested Windows/web/API release.
  # the CI workflow (typecheck, web/api/relay builds, API tests, lint) to pass
  # for the same commit before touching production, so a lint or test
  # regression can no longer ship unnoticed. Manual dispatch is available for
  # emergency/operator deploys.
  workflow_run:
    workflows: ["E2E"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-helper:
    name: Build portable Windows helper
    runs-on: windows-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout tested revision
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable helper
        shell: pwsh
        env:
          REYDESK_API_URL: https://reydesk.com
          REYDESK_RELAY_URL: wss://reydesk.com/ws
          REYDESK_SIGN_CERT_THUMBPRINT: ${{ secrets.REYDESK_SIGN_CERT_THUMBPRINT }}
          REYDESK_SIGN_TIMESTAMP_URL: ${{ vars.REYDESK_SIGN_TIMESTAMP_URL }}
        run: |
          # build-windows.ps1 performs the optional UPX compression once after
          # copying the release binary. Do not pack the same EXE a second time.
          ./apps/agent/build-windows.ps1

      - name: Upload portable helper
        uses: actions/upload-artifact@v4
        with:
          name: reydesk-windows-helper
          path: artifacts/windows/reydesk-helper.exe
          if-no-files-found: error
          retention-days: 7

  build-android-agent:
    name: Build Android agent APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout tested revision
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        env:
          REYDESK_ANDROID_KEYSTORE_B64: ${{ secrets.REYDESK_ANDROID_KEYSTORE_B64 }}
          REYDESK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.REYDESK_ANDROID_KEYSTORE_PASSWORD }}
          REYDESK_ANDROID_KEY_ALIAS: ${{ secrets.REYDESK_ANDROID_KEY_ALIAS }}
          REYDESK_ANDROID_KEY_PASSWORD: ${{ secrets.REYDESK_ANDROID_KEY_PASSWORD }}
        working-directory: apps/agent-android
        run: |
          # Decode the signing keystore when configured; otherwise the build
          # falls back to the debug key so the APK stays installable.
          if [ -n "$REYDESK_ANDROID_KEYSTORE_B64" ]; then
            echo "$REYDESK_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reydesk-keystore.jks"
            echo "REYDESK_ANDROID_KEYSTORE=$RUNNER_TEMP/reydesk-keystore.jks" >> "$GITHUB_ENV"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Stage APK
        run: |
          mkdir -p artifacts/android
          cp apps/agent-android/app/build/outputs/apk/release/app-release.apk artifacts/android/reydesk-agent.apk

      - name: Upload Android agent APK
        uses: actions/upload-artifact@v4
        with:
          name: reydesk-android-apk
          path: artifacts/android/reydesk-agent.apk
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ReyDesk to VPS
    needs: [build-helper, build-android-agent]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success')) && needs.build-helper.result == 'success' }}
    steps:
      # The GitHub CLI needs a checked-out repository to resolve the current
      # owner/repository when querying the CI run for this exact commit.
      - name: Checkout repository metadata
        uses: actions/checkout@v4

      - name: Wait for CI to pass
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          conclusion=""
          for i in $(seq 1 90); do
            conclusion=$(gh run list --workflow "CI" --branch master --limit 100 \
              --json headSha,conclusion \
              --jq "map(select(.headSha == \"$HEAD_SHA\")) | (.[0].conclusion // \"\")")
            if [ -n "$conclusion" ]; then
              break
            fi
            echo "Waiting for CI to complete for $HEAD_SHA (attempt $i)..."
            sleep 20
          done
          if [ "$conclusion" != "success" ]; then
            echo "CI did not pass for $HEAD_SHA (conclusion: ${conclusion:-none}). Refusing to deploy."
            exit 1
          fi
          echo "CI passed for $HEAD_SHA — proceeding with deploy."

      - name: Checkout tested revision
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download portable helper
        uses: actions/download-artifact@v4
        with:
          name: reydesk-windows-helper
          path: artifacts/windows

      - name: Download Android agent APK when available
        if: ${{ needs.build-android-agent.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: reydesk-android-apk
          path: artifacts/android

      - name: Stage helper for upload
        run: cp artifacts/windows/reydesk-helper.exe ./reydesk-helper.exe

      - name: Stage APK for upload when available
        if: ${{ needs.build-android-agent.result == 'success' }}
        run: cp artifacts/android/reydesk-agent.apk ./reydesk-agent.apk

      - name: Prepare helper directories on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /root/reydesk-app/artifacts/windows /root/reydesk-app/artifacts/android

      - name: Upload portable helper to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: reydesk-helper.exe
          target: /root/reydesk-app/artifacts/windows

      - name: Upload Android agent APK to VPS when available
        if: ${{ needs.build-android-agent.result == 'success' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: reydesk-agent.apk
          target: /root/reydesk-app/artifacts/android

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/reydesk-app
            git fetch origin master
            git reset --hard origin/master
            # The production .env.prod (with secrets) is kept on the server and
            # is never committed. If it is missing, refuse to deploy.
            if [ ! -f .env.prod ]; then
              echo "FATAL: .env.prod not found on server — refusing to deploy"
              exit 1
            fi
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            # Wait for the API to become healthy, then verify.
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:4000/healthz >/dev/null 2>&1; then
                echo "API healthy after ${i} checks"
                break
              fi
              sleep 5
            done
            curl -sf http://127.0.0.1:4000/healthz || { echo "API did not become healthy"; exit 1; }
            curl -sf http://127.0.0.1:4100/healthz || { echo "Relay did not become healthy"; exit 1; }
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api test -f /app/artifacts/windows/reydesk-helper.exe || { echo "Portable helper is missing from the production API image"; exit 1; }
            if [ "${{ needs.build-android-agent.result }}" = "success" ]; then
              docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api test -f /app/artifacts/android/reydesk-agent.apk || { echo "Android agent APK is missing from the production API image"; exit 1; }
            else
              echo "Android agent build did not pass; deploying web/API/Windows helper without Android APK"
            fi
            curl -sf https://reydesk.com/healthz || { echo "Public healthz failed"; exit 1; }
            # Sync host nginx config and reload so cache-busting and routing
            # changes take effect without a manual login.
            if [ -f /root/reydesk-app/deploy/nginx-reydesk.conf ]; then
              cp /root/reydesk-app/deploy/nginx-reydesk.conf /etc/nginx/sites-enabled/reydesk.conf
              nginx -t && systemctl reload nginx
              echo "Nginx config synced and reloaded"
            fi

      - name: Deployment summary
        run: echo "ReyDesk deployed to https://reydesk.com"
