name: Build macOS helper

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  gate:
    name: Check macOS signing configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SIGNING_CERTIFICATE: ${{ secrets.REYDESK_MAC_SIGNING_CERTIFICATE_BASE64 }}
          NOTARY_KEY: ${{ secrets.REYDESK_MAC_NOTARY_API_KEY_BASE64 }}
        run: |
          if [[ -n "$SIGNING_CERTIFICATE" && -n "$NOTARY_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing credentials are not configured; no package will be published."
          fi

  build:
    name: Build signed universal macOS helper
    needs: gate
    if: ${{ needs.gate.outputs.ready == 'true' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.REYDESK_MAC_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.REYDESK_MAC_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/reydesk-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/reydesk-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "runner" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "runner" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN_PATH"
      - name: Configure notarization profile
        env:
          NOTARY_KEY_BASE64: ${{ secrets.REYDESK_MAC_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.REYDESK_MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.REYDESK_MAC_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials reydesk-notary \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
      - name: Build package
        env:
          REYDESK_MAC_SIGNING_IDENTITY: ${{ secrets.REYDESK_MAC_SIGNING_IDENTITY }}
          REYDESK_MAC_NOTARY_PROFILE: reydesk-notary
        run: ./apps/agent/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reydesk-macos-helper
          path: artifacts/macos/reydesk-helper.dmg
          if-no-files-found: error
