  <body>
    <div id="root"></div>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.deskos.com/#organization",
          "name": "DeskOS",
          "url": "https://www.deskos.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.deskos.com/deskos-icon-192.png",
            "width": 192,
            "height": 192
          },
          "sameAs": [
            "https://github.com/thesaveddev/deskos",
            "https://twitter.com/deskos",
            "https://linkedin.com/company/deskos"
          ],
          "description": "Remote support, device management, and IT ticketing in one app.",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "GB"
          },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "sales@deskos.com",
              "availableLanguage": "English"
            },
            {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@deskos.com",
              "availableLanguage": "English"
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.deskos.com/#website",
          "url": "https://www.deskos.com",
          "name": "DeskOS",
          "publisher": { "@id": "https://www.deskos.com/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.deskos.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "DeskOS",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Windows, Web",
          "description": "One app for remote desktop support, device management, and IT tickets.",
          "url": "https://www.deskos.com",
          "screenshot": "https://www.deskos.com/og-deskos.png",
          "offers": [
            {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free for up to 3 technicians"
            },
            {
              "@type": "Offer",
              "price": "29",
              "priceCurrency": "USD",
              "description": "Starter — per technician per month"
            },
            {
              "@type": "Offer",
              "price": "79",
              "priceCurrency": "USD",
              "description": "Pro — per technician per month"
            }
          ],

          "featureList": [
            "Remote desktop support",
            "Device monitoring and inventory",
            "Ticketing with SLA tracking",
            "Knowledge base",
            "Audit log",
            "Self-hostable",
            "OAuth2 API"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is DeskOS self-hosted or cloud?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Both. Run it on your own VPS with Docker, or use the hosted version. Your data stays on your infrastructure if you self-host."
              }
            },
            {
              "@type": "Question",
              "name": "How does remote support work without pre-installing anything?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The endpoint user downloads a small helper, enters an 8-digit code you give them, and you connect. No account needed on their end."
              }
            },
            {
              "@type": "Question",
              "name": "Is there a free plan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Free for up to 3 technicians and 100 devices. No time limit, no credit card."
              }
            }
          ]
        }
      ]
    }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
