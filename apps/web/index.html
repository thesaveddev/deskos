            {
              "@type": "ContactPoint",
              "contactType": "customer support",

              "availableLanguage": "English"
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.deskos.com/#website",
          "url": "https://www.deskos.com",
          "name": "DeskOS",
          "publisher": { "@id": "https://www.deskos.com/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.deskos.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "DeskOS",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Windows, Web, Android, iOS",
          "description": "DeskOS unifies remote control, endpoint management, and IT service management in one consent-first, AI-assisted platform.",
          "url": "https://www.deskos.com",
          "screenshot": "https://www.deskos.com/og-deskos.png",
          "offers": [
            {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free for up to 3 technicians"
            },
            {
              "@type": "Offer",
              "price": "29",
              "priceCurrency": "USD",
              "description": "Starter — per technician per month"
            },
            {
              "@type": "Offer",
              "price": "79",
              "priceCurrency": "USD",
              "description": "Pro — per technician per month"
            }
          ],
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "bestRating": "5",
            "ratingCount": "120"
          },
          "featureList": [
            "Remote desktop support with E2E encryption",
            "Endpoint management and RMM",

            "OAuth2 API with OpenAPI 3.1",
            "Multi-tenant MSP console",
            "Web Push notifications"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does consent-first mean?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every remote session requires explicit user consent. There is no way to bypass this — the agent enforces it at the protocol level, and every consent event is recorded in the audit log."
              }
            },
            {
              "@type": "Question",
              "name": "Is DeskOS self-hosted or cloud?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Both. DeskOS runs on a single VPS for small deployments and scales horizontally. A Docker Compose stack is included. You own your data."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need Rust on the managed devices?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. The agent is a compiled Windows binary — you distribute the MSI. The Rust toolchain is only needed to build the agent from source."
              }
            },
            {
              "@type": "Question",
              "name": "Can I connect from my phone?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. DeskOS has a responsive web console that works on any browser and a native mobile app for Android and iOS. Web Push notifications alert you to new sessions."
              }
            }
          ]
        }
      ]
