[package]
name = "deskos-agent"
version = "0.1.0"
edition = "2021"
description = "ReyDesk endpoint agent (Windows/macOS/Linux)"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
futures-util = "0.3"
getrandom = "0.2"
openh264 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
xcap = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30"
tokio = { version = "1.39", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
webrtc = "0.11"
windows = { version = "0.52", features = ["Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2"
windows-service = "0.7"
winreg = "0.55"
