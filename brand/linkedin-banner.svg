<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" fill="none">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b658"/><stop offset="1" stop-color="#d4872a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="396">
      <stop offset="0" stop-color="#0e1114"/><stop offset="1" stop-color="#14181d"/>
    </linearGradient>
  </defs>
  <rect width="1584" height="396" fill="url(#bg)"/>
  <!-- subtle construction grid -->
  <g stroke="#1a2027" stroke-width="1">
    <path d="M0 99V0H1584V99"/><path d="M0 297V396H1584V297"/>
    <path d="M396 0V396"/><path d="M792 0V396"/><path d="M1188 0V396"/>
  </g>
  <!-- left: wordmark + mark -->
  <g transform="translate(80,118)">
    <rect x="0" y="-8" width="46" height="168" rx="14" fill="#14181d" stroke="#242b33" stroke-width="2"/>
    <path d="M12 62 C 22 24, 34 24, 44 62" stroke="url(#ac)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="13" y="56" width="9" height="8" rx="2.5" fill="#5b9dd6"/>
    <rect x="33" y="56" width="9" height="8" rx="2.5" fill="url(#ac)"/>
    <text x="62" y="26" fill="#e6e9ec" font-family="'IBM Plex Sans',sans-serif" font-size="52" font-weight="600" letter-spacing="-1">Desk<span fill="#e8a33d">OS</span></text>
    <text x="64" y="56" fill="#5f6b77" font-family="'IBM Plex Mono',monospace" font-size="15" letter-spacing="6">IT SUPPORT OS</text>
  </g>
  <!-- right: tagline -->
  <text x="900" y="150" fill="#e6e9ec" font-family="'IBM Plex Sans',sans-serif" font-size="40" font-weight="500" letter-spacing="-0.5">
