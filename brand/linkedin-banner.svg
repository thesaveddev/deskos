  </text>
  <g>
    <rect x="900" y="250" width="236" height="48" rx="9" fill="none" stroke="#e8a33d" stroke-width="2"/>
    <text x="1018" y="281" fill="#e8a33d" font-family="'IBM Plex Mono',monospace" font-size="16" letter-spacing="3" text-anchor="middle">IN THE MAKING</text>
  </g>
  <!-- etch footer -->
  <text x="80" y="360" fill="#5f6b77" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="3">DESKOS</text>
  <text x="1504" y="360" fill="#5f6b77" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="3" text-anchor="end">01 — FOUNDATION</text>
