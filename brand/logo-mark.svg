<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <!-- ReyDesk logo mark: support beacon / routing node. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b658"/>
      <stop offset="1" stop-color="#e8a33d"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="72" fill="#0e1114"/>
  <rect x="24" y="24" width="272" height="272" rx="56" fill="none" stroke="#242b33" stroke-width="2"/>
  <!-- desk surface -->
  <rect x="86" y="150" width="148" height="10" rx="5" fill="#242b33"/>
  <!-- rack/console posts -->
  <rect x="86" y="150" width="8" height="66" rx="4" fill="#303a45"/>
  <rect x="226" y="150" width="8" height="66" rx="4" fill="#303a45"/>
  <!-- routed node: beam path from inbox into ticket -->
  <path d="M100 132 C 132 60, 188 60, 220 132" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M100 132 C 132 176, 188 176, 220 132" stroke="#303a45" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- ingress ampoule / envelope -->
  <rect x="84" y="118" width="24" height="18" rx="5" fill="#14181d" stroke="#5b9dd6" stroke-width="3"/>
  <!-- egress ticket -->
  <rect x="212" y="118" width="24" height="18" rx="5" fill="#14181d" stroke="url(#accent)" stroke-width="3"/>
  <rect x="216" y="124" width="14" height="3" rx="1.5" fill="#f2b658"/>
  <rect x="216" y="131" width="9" height="3" rx="1.5" fill="#4a4f55"/>
</svg>
